<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="formulario">
        <h1>Cálculo de compras</h1>

        <form action="/ejercicio1" method="POST">

            <label>Ingresa tu nombre</label><br>
            <input type="text" name="nombre" required><br><br>

            <label>Ingresa tu edad</label><br>
            <input type="number" name="edad" required><br><br>

            <label>Ingresa la cantidad de tarros de pintura a comprar</label><br>
            <input type="number" name="cantidad" required><br><br>

            <button type="submit">Calcular</button>

        </form>

        {% if nombre %}
    <h3>Resultado</h3>

    <p>Nombre del cliente: {{ nombre }}</p>
    <p>Total sin descuento: ${{ total }}</p>
    <p>El descuento es: ${{ descuento | int }}</p>
    <p>El total a pagar es de: ${{ total_pagar | int }}</p>
{% endif %}

        <br>
        <a href="/">Volver al menú principal</a>
    </div>

</body>
</html>
